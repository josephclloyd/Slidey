excluded:
  - .claude
  - .build
  - .github
  - external

disabled_rules:
  - trailing_comma
  - multiple_closures_with_trailing_closure
  - large_tuple

identifier_name:
  min_length: 1

line_length:
  warning: 150
  error: 300

file_length:
  warning: 2000
  error: 3000

type_body_length:
  warning: 1500
  error: 2500

function_body_length:
  warning: 200
  error: 400

cyclomatic_complexity:
  warning: 20
  error: 50

force_cast:
  severity: error

force_try:
  severity: error

