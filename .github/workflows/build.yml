name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  XCODE_VERSION: '16.3'

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint

  build:
    name: Build
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Build
        run: xcodebuild -scheme Slidey -project Slidey.xcodeproj build CODE_SIGNING_ALLOWED=NO

  test:
    name: Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Test
        run: >
          xcodebuild -scheme Slidey -project Slidey.xcodeproj test
          -destination 'platform=macOS'
          -enableCodeCoverage YES
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO

      - name: Coverage report
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            echo '## Test Coverage' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            xcrun xccov view --report TestResults.xcresult >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
