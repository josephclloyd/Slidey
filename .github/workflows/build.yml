name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  XCODE_VERSION: '16.3'

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
        # SwiftLint never reads the bundled Core ML weight files, so this job doesn't
        # need real LFS content — skip it entirely to avoid drawing from the repo's
        # LFS bandwidth budget on every push.

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint

  build:
    name: Build
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS Pull
        # Xcode's coremlc compiles the .mlpackage weight files at build time, so Build
        # (unlike Lint) needs the real bytes. Restoring from cache above means this only
        # draws LFS bandwidth on a cache miss (first run, or when the weights change),
        # not on every push.
        run: git lfs pull

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Build
        run: xcodebuild -scheme Slidey -project Slidey.xcodeproj build CODE_SIGNING_ALLOWED=NO

  test:
    name: Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS Pull
        run: git lfs pull

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Test
        run: >
          xcodebuild -scheme Slidey -project Slidey.xcodeproj test
          -destination 'platform=macOS'
          -enableCodeCoverage YES
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO

      - name: Coverage report
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            echo '## Test Coverage' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            xcrun xccov view --report TestResults.xcresult >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
