name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  XCODE_VERSION: '16.3'

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint

  build:
    name: Build
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Build
        run: xcodebuild -scheme Slidey -project Slidey.xcodeproj build CODE_SIGNING_ALLOWED=NO

  test:
    name: Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Test
        run: xcodebuild -scheme Slidey -project Slidey.xcodeproj test -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
